services:
  granthalaya-sqlserver:
    # Tested SQL Server 2022 Developer build 16.0.4295.3; update the digest deliberately.
    image: mcr.microsoft.com/mssql/server@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    container_name: granthalaya-sqlserver-dev
    hostname: granthalaya-sqlserver
    # Preserve the image's permission check, then make SQL Server PID 1 so stop signals reach it.
    # The upstream launch_sqlservr.sh currently does not forward SIGTERM (mssql-docker issue #968).
    entrypoint: ["/bin/bash", "-c", "/opt/mssql/bin/permissions_check.sh && exec /opt/mssql/bin/sqlservr"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create dev/sqlserver.env from dev/sqlserver.env.example}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - granthalaya-sqlserver-data:/var/opt/mssql
    mem_limit: 3g
    cpus: 2.0
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  granthalaya-sqlserver-data:
